name: story_dock
description: A stories tray that turns into a floating glass dock as the feed scrolls. Tap the capsule to swipe through stories, or use the stack style.
version: 2.0.0
homepage: https://github.com/YagnikBarasiya23/story_dock
repository: https://github.com/YagnikBarasiya23/story_dock
issue_tracker: https://github.com/YagnikBarasiya23/story_dock/issues
topics:
  - stories
  - animation
  - widget
  - navigation
  - scroll
screenshots:
  - description: The tray scrolls away, the capsule appears and enlarges into a swipeable strip; then the stack dock.
    path: doc/demo.gif
  - description: Open tray, compact capsule, enlarged capsule and stack dock.
    path: doc/screenshot.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
